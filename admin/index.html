<body>
  <style>
    /* Theme the CMS chrome to match the practice's navy branding (#16213e).
       !important because Sveltia sets its own copies of these custom
       properties on :root after login/app-init, which would otherwise
       silently win back over a plain rule (or even an earlier inline style). */
    :root {
      --sui-base-hue: 224 !important;
      --sui-primary-accent-color: hsl(224 55% 34%) !important;
      --sui-primary-accent-color-dark: hsl(224 55% 26%) !important;
      --sui-primary-accent-color-light: hsl(224 55% 42%) !important;
      --sui-primary-accent-color-text: hsl(224 55% 34%) !important;
    }
  </style>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <script>
    CMS.registerPreviewStyle('/css/style.css');
  </script>
</body>
</html>
