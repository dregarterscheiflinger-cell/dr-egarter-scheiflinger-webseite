<body>
  <script>
    // Theme the CMS chrome to match the practice's navy branding (#16213e).
    // Set as inline style so it wins over Sveltia's own CSS regardless of load order.
    var sveltiaTheme = document.documentElement.style;
    sveltiaTheme.setProperty('--sui-base-hue', '224');
    sveltiaTheme.setProperty('--sui-primary-accent-color', 'hsl(224 55% 34%)');
    sveltiaTheme.setProperty('--sui-primary-accent-color-dark', 'hsl(224 55% 26%)');
    sveltiaTheme.setProperty('--sui-primary-accent-color-light', 'hsl(224 55% 42%)');
    sveltiaTheme.setProperty('--sui-primary-accent-color-text', 'hsl(224 55% 34%)');
  </script>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <script>
    CMS.registerPreviewStyle('/css/style.css');
  </script>
</body>
</html>
