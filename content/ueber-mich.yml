badges:
  - Fachärztin für Innere Medizin
  - Fachärztin für Nephrologie & Bluthochdruck
  - Fachärztin für Allgemein- & Familienmedizin
intro:
  - Egal, ob es um Vorsorge, akute Erkrankungen oder die langfristige Betreuung chronischer Beschwerden geht, ich nehme mir die Zeit für Ihre Anliegen und höre Ihnen aufmerksam zu. Eine vertrauensvolle Arzt-Patienten-Beziehung geprägt von Empathie, Respekt und Offenheit bildet für mich die Grundlage einer hochwertigen medizinischen Versorgung.
  - Regelmäßige Fortbildungen und Fachkongresse sichern dabei eine medizinische Versorgung auf dem neuesten Stand der Wissenschaft.
werdegang:
  heading: Mein Weg in die Innere Medizin
  lede: Durch meine langjährige Tätigkeit als Internistin im Krankenhaus – zuletzt als Primarärztin und Oberärztin mit Leitung der Dialyse- und Nierenambulanz – bringe ich umfassende praktische Erfahrung auf dem gesamten Gebiet der Inneren Medizin in meine Wahlarztordination ein.
  image: images/breit.jpg
  image_alt: Dr. Karin Egarter-Scheiflinger
