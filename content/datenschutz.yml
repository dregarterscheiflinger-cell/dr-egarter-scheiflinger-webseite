abschnitte:
  - nummer: "1."
    titel: "Verantwortlicher"
    text: 'Verantwortlich für die Datenverarbeitung auf dieser Website ist:<br>Dr. Karin Egarter-Scheiflinger, Tirolerstraße 18/1, 9800 Spittal/Drau<br>E-Mail: <a href="mailto:ordination@dr-egarter-scheiflinger.at" style="text-decoration:underline;">ordination@dr-egarter-scheiflinger.at</a>'
  - nummer: "2."
    titel: "Allgemeines zum Hosting"
    text: "Diese Website wird bei [Hosting-Anbieter einfügen] gehostet. Beim Aufruf der Website werden automatisch technische Zugriffsdaten (z. B. IP-Adresse, Datum und Uhrzeit des Zugriffs, aufgerufene Seite, verwendeter Browser) in Server-Logfiles gespeichert. Diese Daten dienen der technischen Bereitstellung und Absicherung der Website und werden nicht mit anderen Datenquellen zusammengeführt. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO (berechtigtes Interesse an einem sicheren und funktionsfähigen Betrieb der Website)."
  - nummer: "3."
    titel: "Cookies"
    text: "Diese Website selbst setzt keine Analyse- oder Marketing-Cookies. Durch die Einbindung von Google Maps (siehe Punkt 4) können beim Laden der Karte technisch bedingt Cookies von Google gesetzt werden."
  - nummer: "4."
    titel: "Google Maps"
    text: 'Auf unserer Kontaktseite binden wir eine Landkarte des Dienstes Google Maps ein, um Ihnen die Anfahrt zu unserer Ordination zu erleichtern. Anbieter ist Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland. Beim Aufruf der Kontaktseite wird eine Verbindung zu Servern von Google hergestellt, wobei auch Ihre IP-Adresse übertragen werden kann. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO (berechtigtes Interesse an einer übersichtlichen Anfahrtsbeschreibung). Weitere Informationen finden Sie in der <a href="https://policies.google.com/privacy" target="_blank" rel="noopener" style="text-decoration:underline;">Datenschutzerklärung von Google</a>.'
  - nummer: "5."
    titel: "Online-Terminbuchung (TermiOn)"
    text: "Für die Online-Terminvereinbarung nutzen wir den Terminkalender-Dienst TermiOn. Sobald das entsprechende Buchungswidget auf dieser Seite eingebunden ist, werden hier ergänzend Informationen zum Anbieter sowie zu Art, Umfang und Zweck der dabei verarbeiteten Daten (z. B. Name, Kontaktdaten, gewünschter Termin) ergänzt."
  - nummer: "6."
    titel: "Kontaktaufnahme per Telefon oder E-Mail"
    text: "Wenn Sie per Telefon oder E-Mail mit uns Kontakt aufnehmen, werden Ihre Angaben (z. B. Name, Kontaktdaten, Anliegen) zum Zweck der Bearbeitung Ihrer Anfrage bzw. zur Vorbereitung und Durchführung der ärztlichen Behandlung verarbeitet. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO sowie, soweit Gesundheitsdaten betroffen sind, Art. 9 Abs. 2 lit. h DSGVO in Verbindung mit der ärztlichen Verschwiegenheitspflicht."
  - nummer: "7."
    titel: "Besondere Kategorien personenbezogener Daten (Gesundheitsdaten)"
    text: "Im Rahmen der medizinischen Behandlung verarbeiten wir Gesundheitsdaten im Sinne des Art. 9 DSGVO. Diese Daten unterliegen der ärztlichen Verschwiegenheitspflicht und werden ausschließlich zum Zweck Ihrer Behandlung sowie zur Erfüllung gesetzlicher Aufbewahrungspflichten verarbeitet und nicht an unbefugte Dritte weitergegeben."
  - nummer: "8."
    titel: "Ihre Rechte"
    text: "Ihnen stehen im Rahmen der DSGVO grundsätzlich folgende Rechte zu: Auskunft (Art. 15), Berichtigung (Art. 16), Löschung (Art. 17), Einschränkung der Verarbeitung (Art. 18), Datenübertragbarkeit (Art. 20) sowie Widerspruch (Art. 21) gegen die Verarbeitung Ihrer personenbezogenen Daten. Bitte beachten Sie, dass für Gesundheitsdaten gesetzliche Aufbewahrungspflichten (z. B. nach dem Ärztegesetz) gelten können, die einer sofortigen Löschung entgegenstehen."
  - nummer: "9."
    titel: "Beschwerderecht"
    text: 'Sie haben das Recht, sich bei der österreichischen Datenschutzbehörde zu beschweren:<br>Österreichische Datenschutzbehörde, Barichgasse 40–42, 1030 Wien, <a href="https://www.dsb.gv.at" target="_blank" rel="noopener" style="text-decoration:underline;">www.dsb.gv.at</a>'
  - nummer: "10."
    titel: "Änderungen dieser Datenschutzerklärung"
    text: "Wir behalten uns vor, diese Datenschutzerklärung anzupassen, sobald sich der Umfang der Datenverarbeitung (z. B. durch Einbindung weiterer Dienste) ändert."
