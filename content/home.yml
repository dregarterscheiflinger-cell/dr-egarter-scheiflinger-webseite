leistungen_teaser:
  heading: Ein breites Spektrum der Inneren Medizin
  lede: Von der Vorsorge bis zur individuellen Therapie – ich nehme mir Zeit für ein persönliches Gespräch und begleite Sie mit langjähriger Erfahrung auf dem gesamten Gebiet der Inneren Medizin.
  cards:
    - icon: heart
      title: Herz &amp; Kreislauf
      text: Herzschwäche, KHK, Bluthochdruck, Rhythmusstörungen, Herzklappenerkrankungen, Fettstoffwechselerkrankungen
      link: leistungen.html#internistische-leistungen
    - icon: droplet
      title: Nierengesundheit
      text: Diagnose und Behandlung von Nierenerkrankungen und Bluthochdruck.
      link: leistungen.html#nierengesundheit
    - icon: check-circle
      title: Vorsorge
      text: Jährliche Vorsorge- und Gesundenuntersuchung, Manager-Check, OP-Freigabe.
      link: leistungen.html#vorsorge
    - icon: activity
      title: Diagnostik
      text: Ultraschall, Ruhe- &amp; Belastungs-EKG, Langzeit-EKG, Spirometrie, Labor.
      link: leistungen.html#diagnostik
erstbesuch:
  heading: Ablauf Ihres ersten Besuches
  text: Nach der Terminvereinbarung nehme ich mir bei Ihrem ersten Besuch ausführlich Zeit für ein persönliches Anamnesegespräch und eine gründliche körperliche Untersuchung. Gemeinsam besprechen wir Ihre Beschwerden, bereits vorliegende Befunde und die nächsten Schritte – von weiterführender Diagnostik bis zur individuellen Therapieplanung. So erhalten Sie von Anfang an eine klare Einschätzung Ihrer gesundheitlichen Situation.
  image: images/erstbesuch.jpg
  image_alt: Persönliches Gespräch zwischen Ärztin und Patientin (Symbolbild)
mitbringen:
  heading: Was Sie zur Erstordination mitbringen sollten
  text: Damit ich Sie bestmöglich betreuen kann, bitte ich Sie, zu Ihrer Erstuntersuchung folgende Unterlagen mitzubringen. Je mehr Informationen vorliegen, desto gezielter kann ich Ihre Situation einschätzen und die passende Therapie planen.
  items:
    - E-Card
    - Medikamentenliste mit Dosierung
    - Aktuelle Befunde &amp; Arztbriefe
    - PIN-Code für radiologische Befunde
    - ggf. Impfpass
wahlarzt:
  heading: Wie die Abrechnung als Wahlärztin funktioniert
  text: Ich bin als Wahlärztin ohne Kassenvertrag tätig – das bedeutet mehr Zeit und individuelle Betreuung für Sie. Meine ärztlichen Leistungen verrechne ich direkt mit Ihnen per Honorarnote; die Einreichung bei Ihrer gesetzlichen Krankenkasse übernehme ich für Sie. Von dieser erhalten Sie anschließend einen Teil der Kosten zurückerstattet – mit privater Zusatzversicherung ist häufig sogar die volle Rückerstattung möglich.
quote: „Genießen Sie Ihr Leben, wir kümmern uns um Ihre Beschwerden.“
final_cta_heading: Wir freuen uns auf Sie!
