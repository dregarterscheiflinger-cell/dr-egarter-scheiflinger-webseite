title: OP-Freigabe
image: images/leistungen/op-freigabe.jpg
image_alt: Chirurgische Instrumente vor einer Operation (Symbolbild)
intro:
  - Vor geplanten Operationen wird häufig eine internistische Abklärung vom Krankenhaus gefordert. Wir führen die dazu notwendigen Untersuchungen direkt in unserer Ordination durch. Sollte eine weiterführende Untersuchung, beispielsweise ein Lungenröntgen, erforderlich sein, erhalten Sie bei Bedarf eine  entsprechende Überweisung. Anschließend erfolgt eine individuelle internistische Beurteilung des Nutzen-Risiko-Verhältnisses im Hinblick auf den geplanten operativen Eingriff.
