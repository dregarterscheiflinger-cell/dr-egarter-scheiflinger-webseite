order: 2
id: diagnostik
open: false
icon: activity
title: "Diagnostik"
image: "images/leistungen/diagnostik.jpg"
image_alt: "Ultraschallgerät im Untersuchungsraum (Symbolbild)"
intro:
  - "Ich nehme mir ausreichend Zeit für eine ausführliche Anamnese sowie eine gewissenhafte körperliche Untersuchung in einem ruhigen Ambiente. Dazu gehören das Abtasten der Schilddrüse, das Abhören von Herz und Lunge, das Abtasten und Abhorchen des Bauches, die Inspektion der Beine, sowie Blutdruck- und Pulsmessungen. Wir erheben gemeinsam Ihr persönliches Risikoprofil und besprechen, wie Sie aktiv Ihre Gesundheit fördern und Ihre Lebensqualität steigern können."
gruppen:
  - unterpunkte:
      - titel: "Ruhe-EKG"
        text: "Mit Hilfe von Elektroden wird die elektrische Aktivität des Herzens über dem Brustkorb sowie über Armen und Beinen abgeleitet und auf einem Monitor dargestellt – zum Erfassen von Informationen über Herzrhythmus, Herzfrequenz, Erregungsausbreitungsstörungen und strukturelle Herzerkrankungen."
      - titel: "Belastungs-EKG (Ergometrie)"
        text: "Beim Belastungs-EKG erfolgt die Messung während körperlicher Aktivität am Fahrradergometer, um das Herz bei Belastung zu testen. Es dient der Erfassung Ihrer individuellen Leistungsfähigkeit und stellt die wichtigste nicht-invasive Untersuchungsmethode zur Überprüfung Ihrer Durchblutung am Herzen dar. Weiters ist diese Untersuchung wichtig zur Objektivierung insbesondere unter körperlicher Anstrengung auftretender Herzrhythmusstörungen und zur Therapiekontrolle eines medikamentös eingestellten Blutdrucks sowie zur Erfassung Ihrer Leistungsfähigkeit."
      - titel: "Langzeit-Blutdruckmessung"
        text: "Über 24 Stunden werden Ihre Blutdruckwerte automatisch gemessen. Diese Untersuchung zeigt, wie sich Ihr Blutdruck tagsüber, nachts und unter körperlicher Anstrengung verhält und ermöglicht eine gezielte Therapieanpassung."
      - titel: "Langzeit-EKG"
        text: 'Das Langzeit-EKG zeichnet über 24–72 Stunden Ihre Herzaktivität auf. Damit lassen sich Herzrhythmusstörungen und Beschwerden wie Schwindel, Herzrasen oder Ohnmachtsanfälle abklären. Herzrhythmusstörungen treten oft unvermittelt auf und können in der „Momentaufnahme" des Ruhe-EKG nicht erfasst werden. Sie bekommen ein kleines Gerät in der Ordination angelegt und bringen es am Folgetag wieder zurück. Das Ergebnis wird dann von mir ausgewertet und mit Ihnen besprochen.'
      - titel: "Blutabnahme"
        text: "Die Blutabnahme erfolgt direkt in unserer Ordination. Durch Zusammenarbeit mit einem umliegenden Labor können die meisten wichtigen Blutwerte bestimmt werden."
      - titel: "Harn- und Stuhluntersuchungen"
        text: "Abklärung von Verdauungsbeschwerden. Eine Harnanalyse liefert wichtige Hinweise auf Erkrankungen der Nieren und der Harnblase."
  - unterpunkte:
      - titel: "Ultraschall"
        begriffsliste:
          - begriff: "Echokardiographie (Herzultraschall)"
            beschreibung: "Bei dieser Untersuchung wird das Herz in seiner Struktur und Funktion untersucht. Morphologie und Funktion der Herzklappen werden objektiviert."
          - begriff: "Sonographie des Abdomens"
            beschreibung: "Schmerzfreie Ultraschalluntersuchung des Bauchraums von außen."
          - begriff: "Sonographie der Nieren"
            beschreibung: "Schmerzfreie Ultraschalluntersuchung der Nieren von außen."
          - begriff: "Sonographie der Schilddrüse"
            beschreibung: "Schmerzfreie Ultraschalluntersuchung der Schilddrüse von außen."
          - begriff: "Triplex-Sonographie der Carotis- und Vertebralarterien (Halsgefäße)"
            beschreibung: "Die Halsschlagadern sind dem Ultraschall gut zugänglich, sodass die Beschaffenheit der Arterienwand beurteilt werden kann. So können einerseits Kalkablagerungen oder gar Engstellen erkannt werden und andererseits kann indirekt das Risiko für das Bestehen von Gefäßwandveränderungen im Bereich der Herzkranzgefäße abgeschätzt werden."
          - begriff: "Sonographie der Beinvenen"
            beschreibung: "Zum Ausschluss einer Thrombose."
      - titel: "Spirometrie (Lungenfunktionstest)"
        text: "Das ist ein diagnostisches Verfahren zur Messung der Lungenfunktion. Bei der Untersuchung wird über ein Mundstück, das mit den Lippen fest umschlossen wird, ein- und ausgeatmet. Dieses ist mit einem Messgerät verbunden. Ihre Nase wird während der Messung mit einer Nasenklemme verschlossen. Mit diesem Lungenfunktionstest lassen sich verschiedene Parameter bestimmen, die Aufschluss über das Vorliegen einer Atemwegs- oder Lungenerkrankung geben."
