title: Interne Mutter-Kind-Pass-Untersuchung
intro:
  - Zwischen der 17. und 20. Schwangerschaftswoche ist eine internistische Untersuchung vorgesehen. Sie dient der Früherkennung und Behandlung möglicher Erkrankungen auf dem Gebiet der Inneren Medizin.
