begriffsliste:
  - begriff: "Vorsorgeuntersuchung"
    beschreibung: "Einmal jährlich können Sie ab dem 19. Lebensjahr mit Wohnsitz in Österreich die Vorsorgeuntersuchung kostenlos in Anspruch nehmen. Im Rahmen der Gesundenuntersuchung wird diese bei uns durchgeführt."
  - begriff: "Gesundenuntersuchung"
    beschreibung: "Herz-Kreislauf-Erkrankungen verursachen in unserer Gesellschaft die häufigsten Gesundheitsbeschwerden. Schlechte Ernährungsgewohnheiten und Bewegungsmangel tragen dazu bei, dass wir uns schnell müde und erschöpft fühlen. Eine Änderung des Lebensstils ist hier die wichtigste Maßnahme. Ist eine weitere Behandlung notwendig, entwickeln wir gemeinsam die besten Lösungen, um ein Fortschreiten der Erkrankung zu verhindern und Ihre Lebensqualität zu verbessern."
