begriffsliste:
  - begriff: Vorsorgeuntersuchung
    beschreibung: Ab dem 19. Lebensjahr können Sie die kostenlose Vorsorgeuntersuchung einmal jährlich in Anspruch nehmen, sofern Sie Ihren Wohnsitz in Österreich haben. Gerne führen wir diese Untersuchung im Rahmen der Gesundenuntersuchung bei uns durch.
  - begriff: Gesundenuntersuchung
    beschreibung: Herz-Kreislauf-Erkrankungen verursachen in unserer Gesellschaft die häufigsten Gesundheitsbeschwerden. Schlechte Ernährungsgewohnheiten und Bewegungsmangel tragen dazu bei, dass wir uns schnell müde und erschöpft fühlen. Eine Änderung des Lebensstils ist hier die wichtigste Maßnahme. Ist eine weitere Behandlung notwendig, entwickeln wir gemeinsam die besten Lösungen, um ein Fortschreiten von Erkrankungen zu verhindern und Ihre Lebensqualität zu verbessern.
