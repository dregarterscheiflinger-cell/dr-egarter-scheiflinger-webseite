image_alt: EKG-Aufzeichnung zur Herzuntersuchung (Symbolbild)
intro:
  - Insbesondere für Menschen in leitender Position nimmt die physische und psychische Belastung stetig zu. Lange Arbeitstage, hoher Leistungsdruck, große Verantwortung, mangelnde Erholung und eine ungesunde Lebensweise bedingen ein entsprechend hohes Stressniveau. Dies führt in Summe häufig zu Erkrankungen des Herz-Kreislaufsystems.
  - Ich biete Ihnen eine umfassende Untersuchung, wobei ich mir an einem einzelnen Termin Zeit für ein Anamnesegespräch, eine klinische Untersuchung, ein Ruhe-EKG, eine Ergometrie, eine Herzultraschalluntersuchung und eine Ultraschalluntersuchung Ihrer Halsgefäße nehme. Bitte bringen Sie zu dieser Untersuchung einen aktuellen großen Blutbefund sowie Ruhe-Blutdruckwerte der letzten Wochen mit. Alternativ können Sie vorher zur Blutabnahme zu uns in die Ordination kommen.
