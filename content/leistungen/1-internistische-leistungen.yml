open: true
icon: heart
title: Kompetente Betreuung in allen Bereichen der Inneren Medizin
image: /images/IMG_4992.jpg
image_alt: Ärztin mit Stethoskop bei der Untersuchung (Symbolbild)
intro:
  - |-
    Nach langjähriger Tätigkeit als Internistin im Krankenhaus, bis 2025 Primaria der Internen Abteilung und Leitung der Dialyse und Nierenambulanz war ich täglich mit Erkrankungen des gesamten Spektrums der Inneren Medizin befasst - egal ob Herz- Kreislauferkrankungen, Diabetes, Bluthochdruck, Magen-Darmerkrankungen oder auch Nierenerkrankungen. <br>
    Meine jahrelange praktische Erfahrung sowie die laufende Teilnahme an Kongressen und Fortbildungen ermöglichen mir eine Behandlung nach den neuesten medizinischen Erkenntnissen und wissenschaftlichen Leitlinien.<br>
krankheitsbilder:
  - Herzerkrankungen (Herzschwäche, KHK, Rhythmusstörungen, Herzklappenerkrankungen, )
  - Bluthochdruck
  - Diabetes & Stoffwechselerkrankungen
  - Nierenerkrankungen
  - Magen-Darmbeschwerden
  - Gallengangs- & Lebererkrankungen
  - Schilddrüsenerkrankungen
  - Bluterkrankungen
  - Osteoporose
